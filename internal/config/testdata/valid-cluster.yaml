apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: test-cluster
  region: ap-south-1
  version: "1.30"
  tags:
    environment: test

managedNodeGroups:
  - name: system
    instanceType: m6i.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    labels:
      workload: system

  - name: app-a
    instanceType: m6i.xlarge
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    privateNetworking: true
    labels:
      workload: app
