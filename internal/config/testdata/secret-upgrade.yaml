apiVersion: platform.io/v1
kind: EKSUpgradePlan

metadata:
  name: test-cluster-1-31
  cluster: test-cluster
  region: ap-south-1

spec:
  clusterConfig: ./valid-cluster.yaml
  targetKubernetesVersion: "1.31"

  execution:
    mode: sequential
    stateBackend: sqlite
    stateFile: ./state/upgrade.db
    lock:
      enabled: true
      backend: local
      ttl: 4h

  nodeGroups:
    order:
      - system
      - app-a

  fallback:
    notify:
      # this is deliberately invalid: a literal webhook URL instead of an env var reference
      webhookEnv: https://hooks.slack.com/services/T000/B000/XXXXXXXXXXXXXXXXXXXXXXXX
